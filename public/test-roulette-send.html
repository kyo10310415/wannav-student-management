<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ルーレット通知テスト送信 | WannaV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h1 class="text-2xl font-bold text-gray-800 mb-2">
        <i class="fas fa-flask mr-2 text-blue-500"></i>
        ルーレット通知テスト送信
      </h1>
      <p class="text-gray-600 text-sm mb-6">
        指定したDiscordチャンネルに、ユーザーIDでメンション付きでテスト通知を送信します
      </p>

      <form id="testForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            DiscordチャンネルURL <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            id="channelUrl"
            value="https://discord.com/channels/1176426605309083678/1293539258069417994"
            placeholder="https://discord.com/channels/SERVER_ID/CHANNEL_ID"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            required
          />
          <p class="text-xs text-gray-500 mt-1">
            例: https://discord.com/channels/1176426605309083678/1293539258069417994
          </p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Discord ユーザーID <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            id="discordUserId"
            value="766666980086120470"
            placeholder="766666980086120470"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            required
          />
          <p class="text-xs text-gray-500 mt-1">
            メンション用のDiscordユーザーID（数字のみ）
          </p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            学籍番号 <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            id="studentId"
            placeholder="OLTS250001-AB"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            required
          />
          <p class="text-xs text-gray-500 mt-1">
            実際の生徒の学籍番号を入力してください（データベースに存在する必要があります）
          </p>
        </div>

        <button
          type="submit"
          class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 flex items-center justify-center"
        >
          <i class="fas fa-paper-plane mr-2"></i>
          テスト送信
        </button>
      </form>
    </div>

    <!-- 結果表示エリア -->
    <div id="resultArea" class="hidden">
      <div id="resultContent" class="bg-white rounded-lg shadow-md p-6">
        <!-- 結果がここに表示されます -->
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('testForm');
    const resultArea = document.getElementById('resultArea');
    const resultContent = document.getElementById('resultContent');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const channelUrl = document.getElementById('channelUrl').value.trim();
      const discordUserId = document.getElementById('discordUserId').value.trim();
      const studentId = document.getElementById('studentId').value.trim();

      if (!channelUrl || !discordUserId || !studentId) {
        alert('すべてのフィールドは必須です');
        return;
      }

      // 送信中の表示
      resultArea.classList.remove('hidden');
      resultContent.innerHTML = `
        <div class="text-center py-8">
          <i class="fas fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
          <p class="text-gray-600">送信中...</p>
        </div>
      `;

      try {
        const response = await fetch('/api/roulette/test-send', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            channelUrl,
            discordUserId,
            studentId
          })
        });

        const data = await response.json();

        if (data.success) {
          resultContent.innerHTML = `
            <div class="text-center">
              <i class="fas fa-check-circle text-6xl text-green-500 mb-4"></i>
              <h2 class="text-2xl font-bold text-gray-800 mb-4">送信成功！</h2>
              
              <div class="bg-gray-50 rounded-lg p-4 mb-4 text-left">
                <h3 class="font-semibold text-gray-700 mb-3">送信内容:</h3>
                <div class="space-y-2 text-sm">
                  <p><strong>チャンネルURL:</strong> ${data.data.channelUrl}</p>
                  <p><strong>メンション:</strong> &lt;@${data.data.discordUserId}&gt;</p>
                  <p><strong>生徒名:</strong> ${data.data.studentName}</p>
                  <p><strong>当選確率:</strong> ${data.data.probability}%</p>
                  <p><strong>メッセージID:</strong> ${data.data.messageId}</p>
                </div>
              </div>

              <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-4 text-left">
                <h3 class="font-semibold text-blue-800 mb-2">
                  <i class="fas fa-link mr-2"></i>ルーレットURL:
                </h3>
                <a 
                  href="${data.data.rouletteUrl}" 
                  target="_blank"
                  class="text-blue-600 hover:text-blue-800 break-all text-sm"
                >
                  ${data.data.rouletteUrl}
                </a>
              </div>

              <p class="text-gray-600 text-sm">
                <i class="fas fa-info-circle mr-1"></i>
                Discordチャンネルで通知を確認してください
              </p>
            </div>
          `;
        } else {
          resultContent.innerHTML = `
            <div class="text-center">
              <i class="fas fa-exclamation-circle text-6xl text-red-500 mb-4"></i>
              <h2 class="text-2xl font-bold text-gray-800 mb-4">送信失敗</h2>
              <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                <p class="text-red-700">${data.error || 'Unknown error'}</p>
              </div>
            </div>
          `;
        }
      } catch (error) {
        resultContent.innerHTML = `
          <div class="text-center">
            <i class="fas fa-exclamation-triangle text-6xl text-yellow-500 mb-4"></i>
            <h2 class="text-2xl font-bold text-gray-800 mb-4">エラー</h2>
            <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4">
              <p class="text-yellow-700">${error.message}</p>
            </div>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
