<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Webhook テスト</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">
      <i class="fas fa-vial mr-2"></i>
      Discord Webhook テスト
    </h1>

    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h2 class="text-xl font-semibold mb-4">個別生徒のWebhookテスト</h2>
      
      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2">
          学籍番号
        </label>
        <input 
          type="text" 
          id="studentId" 
          value="" 
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="例: OLTS240123-BN"
        >
        <p class="text-sm text-gray-500 mt-1">
          テスト送信したい生徒の学籍番号を入力してください
        </p>
      </div>

      <button 
        id="testDiscordButton"
        class="w-full bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors font-semibold"
      >
        <i class="fas fa-paper-plane mr-2"></i>
        テストメッセージを送信
      </button>
    </div>

    <div id="status" class="mb-4"></div>
    <div id="result"></div>
  </div>

  <script src="/test-discord.js"></script>
</body>
</html>
