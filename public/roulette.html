<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アンケート特典ルーレット | Wannav VTuberスクール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fade-in 0.5s ease-out;
    }
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background: #ffd700;
      position: absolute;
      animation: confetti-fall 3s linear;
    }
    @keyframes confetti-fall {
      to {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-900 via-pink-900 to-orange-900 min-h-screen flex items-center justify-center">
  
  <!-- Loading State -->
  <div id="loading-state" class="text-center">
    <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-white mx-auto mb-4"></div>
    <p class="text-white text-xl">トークンを確認中...</p>
  </div>
  
  <!-- Error State -->
  <div id="error-state" class="hidden max-w-md mx-auto text-center bg-white rounded-2xl shadow-2xl p-8">
    <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
      <i class="fas fa-exclamation-triangle text-4xl text-red-600"></i>
    </div>
    <h1 class="text-2xl font-bold text-gray-800 mb-4">エラー</h1>
    <p id="error-message" class="text-gray-600 mb-6"></p>
  </div>
  
  <!-- Already Used State -->
  <div id="already-used-state" class="hidden max-w-md mx-auto text-center bg-white rounded-2xl shadow-2xl p-8">
    <div class="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4">
      <i class="fas fa-check-circle text-4xl text-yellow-600"></i>
    </div>
    <h1 class="text-2xl font-bold text-gray-800 mb-4">既に抽選済みです</h1>
    <p class="text-gray-600 mb-4">このルーレットは既に使用されています。</p>
    <div id="previous-result" class="mb-6"></div>
  </div>
  
  <!-- Ready State (Gift Box UI) -->
  <div id="ready-state" class="hidden">
    <div class="bg-gradient-to-br from-white via-yellow-50 to-orange-50 rounded-3xl shadow-2xl p-12 max-w-xl w-full mx-4 relative overflow-hidden border-4 border-yellow-400">
      <!-- Decorative sparkles -->
      <div class="absolute top-4 left-4 text-yellow-400 text-2xl animate-pulse">✨</div>
      <div class="absolute top-4 right-4 text-yellow-400 text-2xl animate-pulse" style="animation-delay: 0.3s">✨</div>
      <div class="absolute bottom-4 left-4 text-yellow-400 text-2xl animate-pulse" style="animation-delay: 0.6s">✨</div>
      <div class="absolute bottom-4 right-4 text-yellow-400 text-2xl animate-pulse" style="animation-delay: 0.9s">✨</div>
      
      <div class="text-center relative z-10">
        <h2 id="student-name" class="text-4xl font-bold mb-3 text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-600"></h2>
        <p class="text-2xl mb-8 text-gray-700 font-semibold">🎁 アンケート特典 🎁</p>
        
        <!-- Gift box illustration -->
        <div id="gift-box" class="relative w-64 h-64 mx-auto mb-8">
          <div class="absolute inset-0 flex items-center justify-center">
            <div class="text-9xl transform hover:scale-110 transition-transform duration-300 cursor-pointer animate-bounce">
              🎁
            </div>
          </div>
        </div>
        
        <div id="prize-status" class="text-xl mb-6 text-gray-700 font-semibold">
          <i class="fas fa-hand-pointer animate-pulse mr-2"></i>
          開封して特典を確認しましょう！
        </div>
        
        <div class="mb-6 text-gray-600">
          <p class="mb-2">あなたの当選確率:</p>
          <p class="text-4xl font-bold text-blue-600" id="probability-display">--%</p>
        </div>
        
        <button 
          id="open-button" 
          class="px-12 py-4 bg-gradient-to-r from-yellow-400 via-orange-400 to-pink-500 text-white rounded-2xl font-bold text-xl hover:from-yellow-500 hover:via-orange-500 hover:to-pink-600 transition-all transform hover:scale-110 shadow-2xl animate-pulse"
        >
          <i class="fas fa-gift mr-3"></i>開封する
        </button>
        
        <p class="text-xs text-gray-500 mt-4">
          <i class="fas fa-info-circle mr-1"></i>
          ボタンをクリックして抽選を開始してください
        </p>
        
        <!-- Result container (hidden initially) -->
        <div id="prize-result" class="hidden mt-8">
          <div id="result-content" class="text-6xl font-bold mb-6"></div>
          <div id="result-message" class="text-2xl mb-8 font-semibold"></div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
  <script>
    const API_BASE = '';
    
    let token = '';
    let probability = 50;
    let studentName = '';
    
    // Get token from URL
    function getTokenFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('token');
    }
    
    // Show state
    function showState(stateName) {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.add('hidden');
      document.getElementById('already-used-state').classList.add('hidden');
      document.getElementById('ready-state').classList.add('hidden');
      
      if (stateName) {
        document.getElementById(stateName + '-state').classList.remove('hidden');
      }
    }
    
    // Show error
    function showError(message) {
      document.getElementById('error-message').textContent = message;
      showState('error');
    }
    
    // Verify token
    async function verifyToken() {
      try {
        const response = await axios.get(`${API_BASE}/api/roulette/verify/${token}`);
        const data = response.data;
        
        if (!data.success) {
          showError(data.error || 'トークンの確認に失敗しました');
          return;
        }
        
        probability = data.probability;
        studentName = data.studentName;
        
        document.getElementById('student-name').textContent = studentName;
        document.getElementById('probability-display').textContent = `${probability}%`;
        
        if (data.isUsed) {
          // Show already used state with previous result
          const resultHtml = data.result === '当たり' 
            ? `<div class="inline-flex items-center px-4 py-2 rounded-full text-lg font-semibold bg-gradient-to-r from-yellow-400 to-orange-500 text-white">
                 <i class="fas fa-trophy mr-2"></i>当たり
               </div>`
            : `<div class="inline-flex items-center px-4 py-2 rounded-full text-lg font-semibold bg-gray-300 text-gray-700">
                 <i class="fas fa-times-circle mr-2"></i>はずれ
               </div>`;
          document.getElementById('previous-result').innerHTML = resultHtml;
          showState('already-used');
        } else {
          showState('ready');
        }
      } catch (error) {
        console.error('Token verification failed:', error);
        if (error.response?.status === 404) {
          showError('無効なトークンです。URLが正しいか確認してください。');
        } else if (error.response?.status === 410) {
          showError('このルーレットURLは有効期限が切れています。');
        } else {
          showError('トークンの確認中にエラーが発生しました。');
        }
      }
    }
    
    // Create confetti
    function createConfetti() {
      const colors = ['#ffd700', '#ff69b4', '#00bfff', '#32cd32', '#ff4500'];
      for (let i = 0; i < 50; i++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.left = Math.random() * 100 + '%';
          confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.animationDelay = Math.random() * 2 + 's';
          document.body.appendChild(confetti);
          
          setTimeout(() => confetti.remove(), 3000);
        }, i * 20);
      }
    }
    
    // Open prize box
    async function openPrizeBox() {
      const openButton = document.getElementById('open-button');
      const prizeStatus = document.getElementById('prize-status');
      const giftBox = document.getElementById('gift-box');
      
      if (openButton) openButton.disabled = true;
      if (prizeStatus) prizeStatus.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>開封中...';
      
      try {
        // Call spin API
        const response = await axios.post(`${API_BASE}/api/roulette/spin`, { token });
        const data = response.data;
        
        if (!data.success) {
          if (prizeStatus) prizeStatus.innerHTML = '<i class="fas fa-exclamation-triangle text-red-500"></i> ' + (data.error || 'エラーが発生しました');
          if (openButton) openButton.disabled = false;
          return;
        }
        
        // Animate gift box opening
        if (giftBox) {
          giftBox.style.transform = 'scale(1.5)';
          giftBox.style.opacity = '0';
          giftBox.style.transition = 'all 0.8s ease-out';
        }
        
        // Wait for animation
        await new Promise(resolve => setTimeout(resolve, 800));
        
        // Hide button and status
        if (openButton) openButton.style.display = 'none';
        if (prizeStatus) prizeStatus.classList.add('hidden');
        if (giftBox) giftBox.classList.add('hidden');
        
        // Show result
        showPrizeResult(data);
        
      } catch (error) {
        console.error('Prize opening failed:', error);
        if (prizeStatus) prizeStatus.innerHTML = '<i class="fas fa-exclamation-triangle text-red-500"></i> エラーが発生しました';
        if (openButton) openButton.disabled = false;
      }
    }
    
    // Show prize result
    async function showPrizeResult(data) {
      const resultContainer = document.getElementById('prize-result');
      const resultContent = document.getElementById('result-content');
      const resultMessage = document.getElementById('result-message');
      const mainCard = document.querySelector('#ready-state > div');
      
      if (resultContainer && resultContent && resultMessage && mainCard) {
        const isWin = data.result === '当たり';
        
        if (isWin) {
          // Celebration theme for winner
          mainCard.className = 'bg-gradient-to-br from-yellow-100 via-orange-100 to-pink-100 rounded-3xl shadow-2xl p-12 max-w-xl w-full mx-4 relative overflow-hidden border-4 border-yellow-400';
          
          resultContent.innerHTML = `
            <div class="animate-bounce">
              <div class="text-8xl mb-4">🏆</div>
              <div class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-500 via-orange-500 to-pink-500">当たり！</div>
            </div>
          `;
          
          resultMessage.innerHTML = `
            <div class="text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-600">
              🎉 おめでとうございます！ 🎉<br>
              <span class="text-xl">1時間コンサルティング権を獲得しました！</span>
            </div>
          `;
          
          // Add confetti effect
          createConfetti();
          
        } else {
          // Sympathy theme for loser
          mainCard.className = 'bg-gradient-to-br from-gray-100 via-blue-50 to-purple-50 rounded-3xl shadow-2xl p-12 max-w-xl w-full mx-4 relative overflow-hidden border-4 border-gray-300';
          
          resultContent.innerHTML = `
            <div class="text-8xl mb-4 opacity-60">😢</div>
            <div class="text-gray-700">残念... はずれ</div>
          `;
          
          resultMessage.innerHTML = `
            <div class="text-gray-600">
              また次回チャレンジしてください！<br>
              <span class="text-lg">引き続きアンケートへのご協力をお願いします。</span>
            </div>
          `;
        }
        
        resultContainer.classList.remove('hidden');
      }
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      token = getTokenFromUrl();
      
      if (!token) {
        showError('トークンが指定されていません。正しいURLでアクセスしてください。');
        return;
      }
      
      await verifyToken();
      
      // Add open button event
      document.getElementById('open-button')?.addEventListener('click', openPrizeBox);
    });
  </script>
</body>
</html>
