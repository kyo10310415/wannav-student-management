[extend]
useDefault = true

# Public Discord IDs are identifiers, not credentials. Tokens and webhook URLs are still scanned.
[[allowlists]]
targetRules = ['discord-client-id']
regexes = ['''\d{17,20}''']

# Explicit sample values only; do not exempt entire source/test directories.
[[allowlists]]
targetRules = ['curl-auth-header']
regexes = ['''YOUR_SESSION_TOKEN''']

[[allowlists]]
targetRules = ['generic-api-key']
regexes = ['''^abc123xyz456$''']

[[allowlists]]
paths = ['''(^|[/\\])node_modules[/\\]''', '''(^|[/\\])\.git[/\\]''']

[[rules]]
id = 'discord-webhook-url'
description = 'Hardcoded Discord webhook credential URL'
regex = '''https://(?:canary\.|ptb\.)?discord(?:app)?\.com/api(?:/v\d+)?/webhooks/\d+/[A-Za-z0-9_-]{20,}'''

[[rules]]
id = 'database-password-url'
description = 'Database connection URL with credentials'
regex = '''(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?):\/\/[^\s:/]+:[^\s@]+@[^\s'"`]+'''
[[rules.allowlists]]
regexes = ['''(?i)://[^\s:/]+:(?:password|your_password)@''']

# Fixed, non-working TLS test fixtures only. Keep scanning real URLs and all test files/history.
[[rules.allowlists]]
regexes = [
  '''^postgres(?:ql)?://fixture:fixture-only@(?:database\.example|dpg-fixture123-a)/fixture(?:\?sslmode=disable&ssl=0)?$''',
  '''^postgres(?:ql)?://fixture%40user:p%40ss%3Aword@database\.example:5544/db%20name\?application_name=fixture&connect_timeout=5$''',
  '''^postgres(?:ql)?://fixture@user:p@ss:word@database\.example:5544/db$''',
]
