name: Secret scan (advisory)
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # Advisory initially: do not change deployment requirements or block existing CI.
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks binary
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan tracked files and new PR history without printing values
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/gitleaks
          SECRET_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/scan-secrets.cjs
